# The API gateway: the only door into the Story Readiness Gate.

# Docker's name server. Names are looked up per request, so a restarted service is found at its new address.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80;
  default_type application/json;

  # Using variables is what makes nginx look the names up per request.
  set $intake_host intake:3000;
  set $reporter_host reporter:3000;

  # Every service logs the same id for one call. Fail fast when a service is dead.
  proxy_set_header X-Request-Id $request_id;
  proxy_connect_timeout 2s;
  proxy_read_timeout 5s;

  location = /health {
    return 200 '{"status":"ok","service":"gateway"}';
  }

  # Jira webhooks go to Intake.
  location = /webhook {
    add_header X-Readiness-Route "intake" always;
    proxy_pass http://$intake_host/webhook;
  }

  # The lookup of every status. No key needed: it says nothing private.
  location = /v1/statuses {
    add_header X-Readiness-Route "reporter" always;
    add_header Access-Control-Allow-Origin "*" always;
    proxy_pass http://$reporter_host;
  }

  # Read one story's grade. Needs an API key. The CORS lines let Swagger UI call it.
  location ~ ^/v1/stories/[A-Z][A-Z0-9]*-[0-9]+/readiness$ {
    add_header X-Readiness-Route "reporter" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Headers "X-Api-Key" always;
    if ($request_method = OPTIONS) {
      return 204;
    }
    # A dev-only key for the proof of concept. A real deployment reads it from a secret store.
    if ($http_x_api_key != "dev-only-api-key") {
      return 401 '{"error":"invalid_api_key","message":"Send a valid X-Api-Key header"}';
    }
    proxy_pass http://$reporter_host;
  }

  # Anything else does not exist.
  location / {
    return 404 '{"error":"route_not_found","message":"No such route on the gateway"}';
  }
}
