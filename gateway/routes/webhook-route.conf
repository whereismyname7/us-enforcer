# The webhook route. Included inside "location = /webhook" in the gateway config.
# Day 5: to pause validation, comment out the LIVE block and uncomment the PAUSED block,
# then run: docker compose exec gateway nginx -t   and   docker compose exec gateway nginx -s reload

# ---- LIVE: Jira webhooks go to the Intake service ----
add_header X-Request-Id $request_id always;
add_header X-Readiness-Route "intake" always;
limit_req zone=webhooks burst=200 nodelay;
proxy_pass http://intake_svc/webhook;

# ---- PAUSED: validation switched off. Stories stay Pending, so the gate stays closed ----
