# Every container in the Story Readiness Gate. Start it with: docker compose up -d --build --wait
name: story-readiness-gate

x-health: &health
  test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
  interval: 3s
  timeout: 3s
  retries: 30

services:

  # The event log.
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=INTERNAL://0.0.0.0:29092
      - --advertise-kafka-addr=INTERNAL://redpanda:29092
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # A stand-in for Jira: stories, CRs, the L4 gate and the board. Laptop port 9000.
  jira-sim:
    build: ./services/jira-sim
    ports:
      - "9000:3000"
    environment:
      WEBHOOK_URL: "http://gateway/webhook"
    healthcheck: *health
    restart: unless-stopped

  # The only door into our system. Laptop port 9001.
  gateway:
    image: nginx:alpine
    ports:
      - "9001:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 3s
      timeout: 3s
      retries: 30
    depends_on:
      intake:
        condition: service_healthy
      reporter:
        condition: service_healthy
    restart: unless-stopped

  # Webhook in, StoryChanged out. The only service that knows Jira's field names.
  intake:
    build: ./services/intake
    environment:
      KAFKA_BROKER: "redpanda:29092"
      JIRA_URL: "http://jira-sim:3000"
    healthcheck: *health
    depends_on:
      redpanda:
        condition: service_healthy
      jira-sim:
        condition: service_healthy
    restart: unless-stopped

  # StoryChanged in, StoryChecked out. Knows the rules and the target architecture, never Jira.
  checker:
    build: ./services/checker
    environment:
      KAFKA_BROKER: "redpanda:29092"
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  # StoryChecked in, level and comment out. The only service that writes to Jira.
  reporter:
    build: ./services/reporter
    environment:
      KAFKA_BROKER: "redpanda:29092"
      JIRA_URL: "http://jira-sim:3000"
    healthcheck: *health
    depends_on:
      redpanda:
        condition: service_healthy
      jira-sim:
        condition: service_healthy
    restart: unless-stopped

  # Try the API in a browser. Laptop port 9002.
  swagger:
    image: swaggerapi/swagger-ui
    ports:
      - "9002:8080"
    environment:
      SWAGGER_JSON: "/spec/openapi.yaml"
    volumes:
      - ./api:/spec:ro
    restart: unless-stopped

  # The case viewer: every story and CR with its grade. Laptop port 9003.
  ui:
    image: nginx:alpine
    ports:
      - "9003:80"
    volumes:
      - ./ui:/usr/share/nginx/html:ro
    restart: unless-stopped

  # ---- Tools. Started by hand only. ----

  # The story from start to finish: docker compose run --rm demo
  demo:
    image: node:20-alpine
    working_dir: /work
    volumes:
      - ./demo:/work:ro
    environment:
      JIRA_URL: "http://jira-sim:3000"
      GATEWAY_URL: "http://gateway"
    command: ["node", "demo.js"]
    profiles: ["tools"]

  # Architecture rules: docker compose run --rm fitness
  fitness:
    image: node:20-alpine
    working_dir: /work
    volumes:
      - ./:/work:ro
    command: ["node", "fitness/service-boundaries.js"]
    profiles: ["tools"]

  # Load test for the SLO: docker compose run --rm k6
  k6:
    image: grafana/k6
    volumes:
      - ./load:/scripts:ro
    environment:
      JIRA_URL: "http://jira-sim:3000"
    command: ["run", "/scripts/story-burst.js"]
    profiles: ["tools"]

  # Render the C4 diagrams: docker compose run --rm diagrams
  diagrams:
    image: plantuml/plantuml
    working_dir: /work
    volumes:
      - ./docs:/work
    command: ["-tpng", "context.puml", "containers.puml"]
    profiles: ["tools"]
