# A hash sign starts a comment in YAML. The computer ignores these lines.
# The public API of our gateway, the only door into the Story Readiness Gate.
# Only the two calls people use are listed. The gateway also takes Jira's signed webhooks on POST /webhook,
# and answers /health and /v1/status/intake|reporter for monitoring.
openapi: 3.0.3

info:
  title: Story Readiness Gate API
  version: 1.0.0
  description: >
    Read a story's last grade, or ask for it to be checked again. Both need the X-Api-Key header
    (already filled in Swagger UI). Errors are JSON: {"error", "message", "request_id"}.

servers:
  - url: http://localhost:9001
    description: Local machine

tags:
  - name: Readiness

paths:

  # The last grade of one story.
  /v1/stories/{key}/readiness:
    get:
      tags: ["Readiness"]
      operationId: getStoryReadiness
      summary: The last grade of one story
      security:
        - ReadinessApiKey: []
      parameters:
        - $ref: "#/components/parameters/StoryKey"
      responses:
        "200":
          description: The grade
          content:
            application/json:
              example: { "state": "Graded", "level": 4, "failed": [], "warnings": [{ "id": "I-SEC-01", "level": 4, "message": "Needs security review: payment" }], "teams": ["Checkout Team", "Warehouse Team"] }
        "401":
          description: invalid_api_key
        "404":
          description: not_graded

  # Ask for one story to be checked again.
  /v1/stories/{key}/recheck:
    post:
      tags: ["Readiness"]
      operationId: recheckStory
      summary: Check one story again
      security:
        - ReadinessApiKey: []
      parameters:
        - $ref: "#/components/parameters/StoryKey"
      responses:
        "202":
          description: A new check was started
          content:
            application/json:
              example: { "published": 1, "event_id": "3922afb6-9de3-4738-b533-35e6da7917a1" }
        "401":
          description: invalid_api_key
        "404":
          description: story_not_found

components:
  # The API key, sent in the X-Api-Key header. Its value comes from READINESS_API_KEY.
  securitySchemes:
    ReadinessApiKey:
      type: apiKey
      in: header
      name: X-Api-Key
  parameters:
    # A Jira story key, for example NORTH-1. Anything else is a 404 from the gateway.
    StoryKey:
      name: key
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Z][A-Z0-9]*-[0-9]+$"
        example: NORTH-1
