openapi: 3.0.3
info:
  title: Story Readiness Gate
  version: "1.0"
  description: |
    **Try the flow in order:** create CR-12, create a story (it becomes NORTH-1), read it, try to move it (refused),
    add Warehouse to the CR, fix the story, read it again (L4), move it, see the board.
    Grading takes about a second, and the story's `comments` say what is missing. POST /admin/reset starts over.
servers:
  - url: http://localhost:9000
    description: Jira simulator
paths:
  /rest/api/v3/issue:
    post:
      summary: 1. Create a CR or a story
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
            examples:
              cr:
                summary: "First: CR-12"
                value:
                  key: CR-12
                  fields:
                    issuetype: { name: Change Request }
                    summary: Customers can reserve stock during checkout
                    status: Approved
                    impactedSystems: [Checkout]
                    outOfScope: [discount, delivery fee]
              weakStory:
                summary: "Then: a weak story, linked to CR-12"
                value:
                  fields:
                    project: { key: NORTH }
                    issuetype: { name: Story }
                    summary: "[Cart] Reserve stock"
                    asA: customer
                    iWant: my items reserved
                    soThat: they don't sell out
                    acceptanceCriteria: Stock should be reserved quickly at checkout. Reservation time TBD.
                    crKey: CR-12
      responses:
        "201": { description: Created }
        "400": { description: Unknown issue type }
        "409": { description: The key already exists }
  /rest/api/v3/issue/{key}:
    parameters:
      - { name: key, in: path, required: true, schema: { type: string }, example: NORTH-1 }
    get:
      summary: 2. Read a story, with its level, what is missing and its comments
      responses:
        "200": { description: The issue }
        "404": { description: Not found }
    put:
      summary: 4. Edit a story or a CR. The story goes back to Pending and is checked again.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
            examples:
              declareWarehouse:
                summary: "For key CR-12: declare Warehouse"
                value:
                  fields:
                    impactedSystems: [Checkout, Warehouse]
              fixedStory:
                summary: "For key NORTH-1: fix the story (reaches L4)"
                value:
                  fields:
                    acceptanceCriteria: "Given an item is in my cart, When I start checkout, Then 1 unit is reserved within 2 seconds.\nGiven the item is out of stock, When I start checkout, Then I see an out-of-stock message."
                    technicalNotes: "Checkout publishes a StockReserved event to Warehouse. Data owner: Warehouse."
              scopeCreep:
                summary: "For key NORTH-1: add out-of-scope work (drops to L3)"
                value:
                  fields:
                    technicalNotes: "Checkout publishes a StockReserved event to Warehouse. Data owner: Warehouse. Also apply a discount to reserved items."
      responses:
        "204": { description: Saved }
        "404": { description: Not found }
  /rest/api/v3/issue/{key}/transitions:
    post:
      summary: 3. Move a story to Ready for Dev. The gate allows only L4.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string }, example: NORTH-1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
            example: { to: Ready for Dev }
      responses:
        "204": { description: Moved }
        "400": { description: Not ready for development }
  /board:
    get:
      summary: 5. The developer board. Only stories that passed the gate.
      responses:
        "200": { description: The board }
  /admin/reset:
    post:
      summary: Start over
      responses:
        "204": { description: Everything is gone }
  /v1/stories/{key}/readiness:
    servers:
      - url: http://localhost:9001
        description: API gateway
    get:
      summary: Read a story's grade through the gateway
      parameters:
        - { name: key, in: path, required: true, schema: { type: string }, example: NORTH-1 }
        - { name: X-Api-Key, in: header, required: true, schema: { type: string, default: dev-only-api-key } }
      responses:
        "200": { description: The latest grade }
        "401": { description: Missing or wrong API key }
        "404": { description: Not graded yet }
