# The Jira simulator (jira-sim): the main demo flow only, in the order you run it.
# Internal routes used by our services and tests (issueLink, readiness, search, admin) are left out on purpose.
openapi: 3.0.3

info:
  title: Jira simulator - story flow
  version: 1.0.0
  description: >
    Run top to bottom, choosing the example named in each step:

    1. Create → "CR-12". 2. Create → "NORTH-1, weak story" (it mentions CR-12, so it is linked automatically).

    3. Read the card for NORTH-1 → level L1 and what is missing. 4. Move to Ready for Dev → 400, blocked.

    5. Update CR-12 → "add Warehouse". 6. Update NORTH-1 → "fix the story". 7. Read the card → L4.

    8. Move to Ready for Dev → 204. 9. Board → NORTH-1 is there.

    Optional: Update NORTH-1 → "scope creep" → card shows L3 and it is moved back; Move → "override".

    To start over: docker compose restart jira-sim

servers:
  - url: http://localhost:9000
    description: Local machine

# The steps, in order. Swagger shows the endpoints grouped under these headings.
tags:
  - name: 1. Create
  - name: 2. Read the card
  - name: 3. Move to Ready for Dev
  - name: 4. Update
  - name: 5. Developer board

paths:

  # Step 1: create the CR, then the story.
  /rest/api/v3/issue:
    post:
      tags: ["1. Create"]
      operationId: createIssue
      summary: Create a Change Request or a story
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            examples:
              cr12:
                summary: CR-12, approved, Checkout only (create first)
                value: { "key": "CR-12", "fields": { "project": { "key": "CR" }, "issuetype": { "name": "Change Request" }, "summary": "Customers can reserve stock during checkout", "status": "Approved", "impactedSystems": ["Checkout"], "inScope": ["reserve stock during checkout", "release unpaid reservations"], "outOfScope": ["discount", "delivery fee"], "targetDate": "2026-12-15" } }
              weakStory:
                summary: NORTH-1, weak story (mentions CR-12, grades L1)
                value: { "key": "NORTH-1", "fields": { "project": { "key": "NORTH" }, "issuetype": { "name": "Story" }, "summary": "[Cart] Reserve stock", "asA": "customer", "iWant": "my items reserved", "soThat": "they don't sell out", "acceptanceCriteria": "Stock should be reserved quickly at checkout. Reservation time TBD.", "technicalNotes": "Part of CR-12." } }
      responses:
        "201":
          description: Created
          content:
            application/json:
              example: { "key": "NORTH-1" }
        "409":
          description: The key already exists (restart jira-sim to start over)

  # Steps 3 and 7: read the card. Level and status come first.
  /rest/api/v3/issue/{key}:
    parameters:
      - $ref: "#/components/parameters/Key"
    get:
      tags: ["2. Read the card"]
      operationId: getCard
      summary: The story card - level first, then what is missing
      responses:
        "200":
          description: The card. "level" is L0 to L4, or Pending while the latest save is being checked.
          content:
            application/json:
              example: { "key": "NORTH-1", "type": "Story", "level": "L1", "status": "Refinement", "summary": "[Cart] Reserve stock", "missing": ["R-AC-01: 1 criteria are not Given/When/Then", "R-OPQ-01: Open question left: \"TBD\""], "warnings": [], "links": [{ "relation": "implements", "key": "CR-12", "type": "Change Request", "status": "Approved" }], "comments": [{ "author": "story-readiness-bot", "body": "Story readiness: L1 of 4. ...", "created": "2026-11-04T10:00:22.442Z" }], "updated": "2026-11-04T10:00:21.505Z" }
        "404":
          description: No issue with that key

    # Steps 5 and 6: update the CR, then the story.
    put:
      tags: ["4. Update"]
      operationId: updateIssue
      summary: Change fields (set the key to match the example)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            examples:
              crAddWarehouse:
                summary: CR-12, add Warehouse (key CR-12)
                value: { "fields": { "impactedSystems": ["Checkout", "Warehouse"] } }
              fixStory:
                summary: NORTH-1, fix the story (key NORTH-1)
                value: { "fields": { "acceptanceCriteria": "Given an item is in my cart, When I start checkout, Then 1 unit is reserved within 2 seconds.\nGiven a reservation is 15 minutes old, When payment has not completed, Then the unit is released.\nGiven the item is out of stock, When I start checkout, Then I see an out-of-stock message.", "technicalNotes": "Part of CR-12. Checkout publishes a StockReserved event to Warehouse. Data owner: Warehouse." } }
              scopeCreep:
                summary: NORTH-1, scope creep - adds a discount (key NORTH-1)
                value: { "fields": { "technicalNotes": "Part of CR-12. Checkout publishes a StockReserved event to Warehouse. Data owner: Warehouse. Also apply a discount to reserved items." } }
      responses:
        "204":
          description: Saved. The card shows Pending until it is checked again (well under a second).

  # Steps 4 and 8: try to move the story to Ready for Dev. The gate decides.
  /rest/api/v3/issue/{key}/transitions:
    parameters:
      - $ref: "#/components/parameters/Key"
    post:
      tags: ["3. Move to Ready for Dev"]
      operationId: moveToReadyForDev
      summary: Move the story to Ready for Dev (allowed only at L4 with a CR, or with an override)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            examples:
              readyForDev:
                summary: Ready for Dev
                value: { "to": "Ready for Dev" }
              override:
                summary: Ready for Dev with an architect's override
                value: { "to": "Ready for Dev", "override": { "by": "lead.architect", "role": "architect", "reason": "Agreed with the PO for the demo" } }
      responses:
        "204":
          description: Moved
        "400":
          description: Blocked by the gate
          content:
            application/json:
              example: { "errorMessages": ["This story is not ready for development. See the readiness comment for what is missing."], "errors": { "readiness": "L1" } }

  # Step 9: what developers see.
  /board:
    get:
      tags: ["5. Developer board"]
      operationId: getBoard
      summary: Stories in Ready for Dev that passed the gate, or were overridden
      responses:
        "200":
          description: The board
          content:
            application/json:
              example: { "issues": [{ "key": "NORTH-1", "summary": "[Cart] Reserve stock", "level": "L4", "override": false }] }

components:
  parameters:
    # The issue key: NORTH-1 for the story, CR-12 for the CR.
    Key:
      name: key
      in: path
      required: true
      schema:
        type: string
        example: NORTH-1
