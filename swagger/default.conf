# Swagger UI for our two API contracts, on laptop port 9002.
# It also forwards "Try it out" calls to the gateway and the simulator, so the browser
# only ever talks to one address and needs no CORS. Developer tool only; holds no rules.

# Docker's own name server. Names are looked up per request, so a restarted container is found again.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  # Listen on the normal web port inside this container.
  listen 80;

  # The Swagger UI page and the two OpenAPI files (api/ is mounted read-only under /specs/).
  location / {
    root /usr/share/nginx/html;
    index index.html;
  }

  # /gateway/... goes to the API gateway, with the prefix removed. Headers such as X-Api-Key pass through.
  location /gateway/ {
    set $gateway_host gateway;
    rewrite ^/gateway/(.*)$ /$1 break;
    proxy_pass http://$gateway_host;
  }

  # /jira/... goes to the Jira simulator, with the prefix removed. Headers such as X-Actor pass through.
  location /jira/ {
    set $jira_host jira-sim:3000;
    rewrite ^/jira/(.*)$ /$1 break;
    proxy_pass http://$jira_host;
  }
}
