<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Story Readiness Gate - API</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui.css">
  <style>body { margin: 0; }</style>
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui-standalone-preset.js"></script>
  <script>
    // The dev-only defaults from docker-compose.yml. Never a real secret.
    const API_KEY_VALUE = "dev-only-api-key";
    const SIGNING_VALUE = "dev-only-change-me";

    // The servers listed in the OpenAPI files, and where this page forwards them.
    const FORWARDS = [
      ["http://localhost:9001", "/gateway"],
      ["http://gateway", "/gateway"],
      ["http://localhost:9000", "/jira"],
      ["http://jira-sim:3000", "/jira"]
    ];

    // HMAC-SHA256 of a text, as hex: the same signature Jira (the simulator) puts on webhooks.
    async function hmacHex(text) {
      const enc = new TextEncoder();
      const key = await crypto.subtle.importKey("raw", enc.encode(SIGNING_VALUE), { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
      const sig = await crypto.subtle.sign("HMAC", key, enc.encode(text));
      return Array.from(new Uint8Array(sig)).map(function (b) { return b.toString(16).padStart(2, "0"); }).join("");
    }

    // Before each "Try it out" call: send it through this page's forwarder,
    // and sign webhook bodies when the signature field is left as "auto".
    async function prepare(req) {
      for (const pair of FORWARDS) {
        if (req.url.indexOf(pair[0]) === 0) {
          req.url = pair[1] + req.url.slice(pair[0].length);
          break;
        }
      }
      const isWebhook = /\/gateway\/webhook$/.test(req.url.split("?")[0]);
      const given = req.headers["X-Hub-Signature"];
      if (isWebhook && (!given || given === "auto")) {
        const body = typeof req.body === "string" ? req.body : JSON.stringify(req.body);
        req.body = body;
        req.headers["X-Hub-Signature"] = "sha256=" + (await hmacHex(body));
      }
      return req;
    }

    // Build the page with both contracts, the gateway API first.
    window.ui = SwaggerUIBundle({
      urls: [
        { url: "specs/openapi.yaml", name: "Gateway API (port 9001)" },
        { url: "specs/jira-sim-openapi.yaml", name: "Jira simulator (port 9000)" }
      ],
      "urls.primaryName": "Gateway API (port 9001)",
      dom_id: "#swagger-ui",
      presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
      layout: "StandaloneLayout",
      deepLinking: true,
      tryItOutEnabled: true,
      displayRequestDuration: true,
      persistAuthorization: true,
      requestInterceptor: prepare,
      // Fill in the API key, so the protected routes work straight away.
      onComplete: function () { window.ui.preauthorizeApiKey("ReadinessApiKey", API_KEY_VALUE); }
    });
  </script>
</body>
</html>
