<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Story Readiness Gate - API</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui.css">
  <style>body { margin: 0; }</style>
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui-standalone-preset.js"></script>
  <script>
    // The dev-only default from docker-compose.yml. Never a real secret.
    const API_KEY_VALUE = "dev-only-api-key";

    // The servers listed in the OpenAPI files, and where this page forwards them (no CORS needed).
    const FORWARDS = [
      ["http://localhost:9001", "/gateway"],
      ["http://localhost:9000", "/jira"]
    ];

    // Before each "Try it out" call: send it through this page's forwarder.
    function prepare(req) {
      for (const pair of FORWARDS) {
        if (req.url.indexOf(pair[0]) === 0) {
          req.url = pair[1] + req.url.slice(pair[0].length);
          break;
        }
      }
      return req;
    }

    // Build the page. The story flow comes first; its steps are already in run order.
    window.ui = SwaggerUIBundle({
      urls: [
        { url: "specs/jira-sim-openapi.yaml", name: "Story flow (Jira simulator)" },
        { url: "specs/openapi.yaml", name: "Readiness API (gateway)" }
      ],
      "urls.primaryName": "Story flow (Jira simulator)",
      dom_id: "#swagger-ui",
      presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
      layout: "StandaloneLayout",
      deepLinking: true,
      docExpansion: "list",
      defaultModelsExpandDepth: -1,
      tryItOutEnabled: true,
      displayRequestDuration: true,
      persistAuthorization: true,
      requestInterceptor: prepare,
      // Fill in the API key, so the readiness API works straight away.
      onComplete: function () { window.ui.preauthorizeApiKey("ReadinessApiKey", API_KEY_VALUE); }
    });
  </script>
</body>
</html>
